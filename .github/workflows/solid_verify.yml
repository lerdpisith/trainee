name: SOLID Principles Checker

on:
  push:
    paths:
      - 'solid/exercises/**'
  pull_request:
    paths:
      - 'solid/exercises/**'

jobs:
  check-solid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run SOLID exercises verification
        run: |
          # Set PYTHONPATH to root directory so tests can import modules correctly
          export PYTHONPATH=$PYTHONPATH:.
          pytest solid/exercises/test_exercises.py
